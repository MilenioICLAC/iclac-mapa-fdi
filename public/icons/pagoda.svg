<!-- La pagoda del sitio anterior, redibujada como vector. El original solo existe como
     mapa de bits de 48px (public/favicon.ico), que sirve para la pestaña pero no para
     nada más grande. Las medidas salen de ese mapa de bits: simetría en x=24, cuatro
     techos, cuerpo escalonado, pilares abiertos y puerta en arco. Color #377F83, el
     mismo del botón "Acerca de" del encabezado.

     Fuente de `apple-touch-icon.png`. Si hay que regenerarlo, es este archivo escalado
     a 180px sobre fondo #377F83 con la pagoda en blanco. -->
