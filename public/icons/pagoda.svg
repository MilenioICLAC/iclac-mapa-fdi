  <polygon points="35,20 32,20 34,23 38,23"/>
  <polygon points="8,23 40,23 41,24.5 40,26 8,26 7,24.5"/>
  <rect x="13" y="26" width="22" height="3"/>
  <rect x="10" y="29" width="28" height="3"/>
