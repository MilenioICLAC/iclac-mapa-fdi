# Valida los archivos de datos por país (data/sources/countries/*.xlsx) contra el
# esquema canónico (data/schema/schema.md §7) en cada push que los toque, y publica
# un INFORME HTML en GitHub Pages con un enlace fijo.
#
# El informe dice, país por país, qué está correcto y qué corregir (bloqueante vs
# aviso). El ETL del build integra solo los países que pasan, así que el mapa nunca
# se rompe; este informe es la guía para dejar cada país en verde.
#
# Enlace del informe (Pages): https://<org>.github.io/<repo>/
#
# Setup por única vez en el repo (lo hace un admin): Settings > Pages > Source =
# "GitHub Actions". Es obligatorio: el token del workflow no puede crear el sitio
# Pages solo (la org lo restringe), así que hay que habilitarlo a mano una vez.
name: validate-data

# Sin filtro de rutas, a propósito. Lo tenía, y dejó el sitio publicado desatendido
# dos veces: `validador/**` nunca estuvo en la lista, así que la página podía
# cambiar sin que nada se reconstruyera, y un cambio al propio workflow tampoco
# disparaba. El sitio depende de los datos, del esquema, de los scripts, de la
# página, de la config de vite, de package.json y de este archivo — o sea de casi
# todo el repositorio, y mantener esa lista al día es justo lo que falló.
#
# El costo de disparar de más es un minuto de runner. El de disparar de menos es
# una página pública desactualizada sin que nada lo diga, que es peor y además es
# mudo.
on:
  push:
  workflow_dispatch:

# Permisos para desplegar a Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez POR REFERENCIA. El grupo era `pages` a secas, así que
# un push a una rama entraba al mismo grupo que main y lo cancelaba: el 17-08 una
# corrida de rama mató la de main —la única que puede desplegar— y la página se
# quedó con la versión anterior sin que nada dijera por qué.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  DATA_DIR: data/sources/countries

jobs:
  # Registro de países. Job aparte, a propósito: si countries.csv se rompe, el run
  # tiene que quedar ROJO (define qué países existen y cuáles se publican, y un
  # archivo roto ahí no es un estado normal). Separado del informe para que el
  # informe se publique igual y muestre qué está pasando.
  registro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validar registro de países
        run: node scripts/validate_countries.mjs

  # Construye el sitio (informe + validador). Corre en CUALQUIER rama: validar una
  # rama antes de llevarla a main es señal útil. No declara `environment` a
  # propósito — el entorno github-pages sólo acepta despliegues de la rama por
  # defecto, así que tenerlo acá hacía fallar toda corrida de rama.
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Validación: alimenta el log y el resumen del run. No bloquea la publicación
      # del informe (el informe es justamente lo que muestra qué falla).
      - name: Validar archivos de datos
        continue-on-error: true
        run: node scripts/validate_data.mjs "$DATA_DIR"

      # Tabla de inversores (identidad + ownership). Guardado: solo corre si el
      # archivo y el script están presentes (en el repo de datos puede no estarlo).
      - name: Validar tabla de inversores
        continue-on-error: true
        run: |
          if [ -f scripts/validate_investors.mjs ] && [ -f data/schema/investors_map.csv ]; then
            node scripts/validate_investors.mjs
          else
            echo "tabla de inversores no presente en este repo — se omite"
          fi

      - name: Generar informe (index.html)
        run: |
          mkdir -p site
          node scripts/build_validation_report.mjs "$DATA_DIR" --out site/index.html

      # Validador en el navegador (site/validador/). Mismo núcleo y mismo render
      # que el informe de arriba: la página existe para que ICLAC pueda revisar su
      # archivo ANTES de mandarlo, que es lo que el informe no puede hacer.
      # Se construye después del informe para que no le borre el index.html.
      - name: Construir el validador
        run: npm run validate:page

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publicar es un job aparte y SOLO desde la rama por defecto. Antes iba pegado a
  # la construcción, y como el entorno github-pages rechaza las otras ramas,
  # cualquier push a una rama dejaba el run en rojo por algo que no era un problema
  # de los datos ni del código.
  deploy:
    needs: report
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
